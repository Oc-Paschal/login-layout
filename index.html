<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>login layout</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <div>
            <img src="./download (16).jpeg" alt="download">
        </div>

        <div>
            <h1>Welcome back, Tobe</h1>
            <form>
                <div class="field">
                    <label for="uname">User name:</label>
                    <input type="text" name="uname" placeholder="user name">
                </div>
                <div class="field">
                    <label for="psw">Password:</label>
                    <input type="password" name="psw" placeholder="user password">
                </div>
            </form>
            <button>Submit</button>
        </div>

    </div>

</body>

</html>
